</style></head><body><div id="app"><div id="scene"></div><iframe id="engine" src="./index.html?engine=v13" title="Motor economic V9" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0"></iframe><header><div class="heading"><div><div class="sub">LIVING WORLD · V13 · THREE.JS</div><div class="brand">AI CIVILIZATION <b>13</b></div><div class="sub">Oraș 3D · Economie V9 integrată</div></div><button class="gold" id="openCity">🏛 Guvernator</button></div><nav class="tabs"><button class="active" id="cityTab">🏙 Oraș</button><a href="./governor.html">🏛 Governor OS</a><button id="economyTab">💰 Economie</button><button id="peopleTab">👥 Cetățeni</button><button id="logTab">📰 Jurnal</button><button id="backupTab">💾 Salvări</button><a href="./roadmap.html">🗺 Roadmap</a></nav></header><div class="side"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="fit">⌖</button></div><div class="hud"><div class="status"><span class="clock" id="clock">🌙 Orașul se trezește</span><span id="activity" style="font-size:10px;color:#c3d4de">Trafic și cetățeni animați</span><button id="pause">Ⅱ</button></div><div class="stats"><div class="stat">LOCUITORI<strong id="pop">—</strong></div><div class="stat">CLĂDIRI<strong id="count">—</strong></div><div class="stat">TREZORERIE<strong id="money">—</strong></div></div><div class="actions"><a href="./index.html">⚒ Construiește</a><button class="gold" id="advance">▶ Zi +1</button><button id="journal">☷ Jurnal</button></div></div><input type="file" id="importFile" accept=".json,application/json" hidden><section class="sheet" id="sheet"><button class="close" id="close">✕</button><h2 id="sheetTitle">Oraș</h2><div id="sheetBody"></div></section><div class="warn" id="error"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const KEY='aiciv-save',container=document.getElementById('scene'),sheet=document.getElementById('sheet');

const scene=new THREE.Scene();scene.background=new THREE.Color(0x101e2c);scene.fog=new THREE.Fog(0x101e2c,27,68);

scene.add(new THREE.HemisphereLight(0x8fb9ff,0x263a27,2.2));const sun=new THREE.DirectionalLight(0xffd7a1,2.6);sun.position.set(-12,24,16);scene.add(sun);
const mat=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:.78,...extra}),grass=[mat(0x345944),mat(0x3e684c),mat(0x426e51)],road=mat(0x29343c),line=mat(0xe8d8a6,{emissive:0x6d5b24,emissiveIntensity:.3}),roof=mat(0x6e6760),glass=mat(0xffd78d,{emissive:0xffb75d,emissiveIntensity:1.2}),trunk=mat(0x554436),leaf=mat(0x315d44),stone=mat(0x7b8790);
function box(w,h,d,x,y,z,m,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
const root=new THREE.Group();scene.add(root);
const ground=new THREE.Mesh(new THREE.BoxGeometry(19,.35,19),mat(0x213f31));ground.position.y=-.22;root.add(ground);
const occupied=new Map(),hitObjects=[],carRoutes=[];
for(const b of city.buildings){if(Number.isFinite(b.x)&&Number.isFinite(b.y))occupied.set(b.x+','+b.y,b)}
const typeColor={house:0x96756a,office:0x6c8d9f,school:0xb58a77,lab:0x5c7a9e,factory:0x6d777c,farm:0x7a9665,shop:0xb58b5c,market:0x9b8469};const windows=[];
function tree(x,z,s=1){box(.11,.6*s,.11,x,.3*s,z,trunk,root);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.33*s,1),leaf);crown.position.set(x,.7*s,z);root.add(crown)}
function building(b){let x=b.x-7.5,z=b.y-7.5,t=String(b.type||'house').toLowerCase(),isFactory=t.includes('factory'),isLab=t.includes('lab'),isSchool=t.includes('school'),isFarm=t.includes('farm'),isOffice=t.includes('office');const h=isFarm?.65:isFactory?2:isLab?2.7:isSchool?1.8:isOffice?3:1.2+((b.x*5+b.y*3)%5)*.48;let color=typeColor[t]||typeColor.house;const base=box(.77,h,.77,x,h/2,z,mat(color),root);base.userData.building=b;hitObjects.push(base);box(.87,.13,.87,x,h+.05,z,roof,root);if(isFactory){box(.16,1.5,.16,x+.22,h+.8,z+.2,stone,root)}if(isLab){const dome=new THREE.Mesh(new THREE.SphereGeometry(.23,10,8),mat(0x6ebce5,{emissive:0x21678a,emissiveIntensity:1}));dome.position.set(x,h+.3,z);root.add(dome)}if(isSchool){box(.45,.2,.5,x,h+.23,z,mat(0xb69e68),root)}for(let y=.42;y<h-.08;y+=.47)for(let s of [-1,1])for(let v of [-.22,.22]){let a=box(.13,.2,.015,x+v,y,z+s*.394,glass,root);windows.push(a)}if(isFarm)for(let j=0;j<4;j++)box(.12,.09,.6,x-.32+j*.2,.04,z,mat(0x72964a),root)}
for(let x=0;x<16;x++)for(let y=0;y<16;y++){const xx=x-7.5,zz=y-7.5,street=x%4===0||y%4===0;box(1,.025,1,xx,.02,zz,street?road:grass[(x+y)%3],root);if(street){if(x%4===0&&y%4!==0)box(.025,.006,.26,xx,.038,zz,line,root);if(y%4===0&&x%4!==0)box(.26,.006,.025,xx,.038,zz,line,root)}else if(!occupied.has(x+','+y)&&((x*17+y*11)%7===0))tree(xx,zz,.65+((x+y)%3)*.12)}
for(const b of city.buildings)if(Number.isFinite(b.x)&&Number.isFinite(b.y))building(b);
const people=[],personMaterials=[mat(0xffcc68),mat(0x9dc2e8),mat(0xe68e88),mat(0xb6d394)];for(let i=0;i<Math.min(70,Math.max(12,Math.floor((city.pop||70)/4)));i++){let o=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.15,3,5),personMaterials[i%4]);root.add(o);people.push(o)}
const cars=[];for(let i=0;i<20;i++){const g=new THREE.Group();box(.34,.13,.17,0,.12,0,mat([0xcfc4a2,0x9e5753,0x627d96,0xd1ad62][i%4]),g);box(.17,.08,.14,-.03,.22,0,mat(0x526777),g);root.add(g);cars.push(g)}
let zoom=25,panX=0,panZ=0,paused=false,simHour=19,elapsed=0;
function resize(){let w=container.clientWidth,h=container.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}function positionCamera(){camera.position.set(panX+zoom*.83,zoom*.93,panZ+zoom*.83);camera.lookAt(panX,0,panZ)}
function clampZoom(){zoom=Math.max(10,Math.min(45,zoom))}function show(title,html){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=html;sheet.classList.add('open')}document.getElementById('close').onclick=()=>sheet.classList.remove('open');
function safe(v){return String(v??'—').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}
function summary(){show('🏙 Orașul meu','<p>Populație: <b>'+safe(city.pop)+'</b> · Clădiri: <b>'+city.buildings.length+'</b> · Trezorerie: <b>'+safe(city.money)+'</b></p><p>Motorul 3D citește salvarea V9. Construcțiile și deciziile economice rămân în jocul original.</p><p><a href="./governor.html">Deschide Governor OS</a></p>')}
document.getElementById('openCity').onclick=summary;document.getElementById('cityTab').onclick=()=>sheet.classList.remove('open');document.getElementById('economyTab').onclick=()=>show('💰 Economie','<p>Trezorerie: '+safe(city.money)+'</p><p>Politica economică: '+safe(city.government?.policy||city.policy)+'</p><p><a href="./index.html">Deschide economia în simularea V9</a></p>');document.getElementById('peopleTab').onclick=()=>show('👥 Cetățeni','<p>Populație: '+safe(city.pop)+'</p><p>Cetățenii din scena 3D sunt reprezentări vizuale, nu identități individuale sincronizate.</p>');function journal(){show('📰 Jurnal oraș',Array.isArray(city.log)&&city.log.length?city.log.slice(0,12).map(x=>'<p>• '+safe(x)+'</p>').join(''):'<p>Nu există evenimente salvate în jurnal.</p>')}document.getElementById('logTab').onclick=journal;document.getElementById('journal').onclick=journal;
function backupPanel(){show('💾 Salvări V13','<p>Salvarea este comună cu V9 și Governor OS pe același dispozitiv și domeniu.</p><p><button id="exportNow" class="gold">⬇ Exportă JSON</button> <button id="importNow" class="gold">⬆ Importă JSON</button></p><p>Importul înlocuiește salvarea curentă numai după confirmare. Păstrează fișierul exportat înainte de import.</p>');document.getElementById('exportNow').onclick=()=>{let raw=localStorage.getItem(KEY);if(!raw){alert('Nu există încă o salvare locală.');return}let data;try{data=JSON.parse(raw);if(!Array.isArray(data.buildings))throw Error('Salvare invalidă')}catch(e){alert('Salvarea locală este invalidă.');return}let blob=new Blob([JSON.stringify({format:'aiciv',version:1,world:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-civilization-v13-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};document.getElementById('importNow').onclick=()=>document.getElementById('importFile').click()}document.getElementById('backupTab').onclick=backupPanel;document.getElementById('importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('Fișier prea mare');let data=JSON.parse(await file.text()),world=data.world??data;if(!Array.isArray(world.buildings)||typeof world!=='object')throw Error('Format necunoscut');if(!confirm('Importul va înlocui salvarea actuală. Ai exportat o copie?'))return;localStorage.setItem(KEY,JSON.stringify(world));alert('Import reușit. Reîncarc orașul 3D.');location.reload()}catch(err){alert('Import eșuat: '+err.message)}finally{e.target.value=''}});
let engineReady=false,engineBusy=false;const engineFrame=document.getElementById('engine');function syncWorld(){let next;try{next=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return}if(!Array.isArray(next.buildings))return;const changed=next.buildings.length!==city.buildings.length;city=next;document.getElementById('pop').textContent=city.pop??'—';document.getElementById('count').textContent=city.buildings.length;document.getElementById('money').textContent=Number.isFinite(city.money)?Math.round(city.money).toLocaleString('ro-RO'):'—';if(changed){show('🏗 Orașul s-a dezvoltat','<p>Au apărut clădiri noi. Reîncărcăm scena 3D pentru a le afișa.</p>');setTimeout(()=>location.reload(),900)}}window.addEventListener('storage',e=>{if(e.key===KEY)syncWorld()});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==engineFrame.contentWindow)return;const m=e.data||{};if(m.type==='aiciv-v13-ready'){engineReady=true;document.getElementById('activity').textContent='● Motor economic conectat'}if(m.type==='aiciv-v13-done'){engineBusy=false;syncWorld();document.getElementById('activity').textContent='● An '+m.year+' · Zi '+m.day}if(m.type==='aiciv-v13-error'){engineBusy=false;show('Eroare simulare','<p>'+safe(m.message)+'</p>')}});document.getElementById('advance').onclick=()=>{if(!engineReady){show('Motorul se încarcă','<p>Așteaptă câteva secunde și încearcă din nou.</p>');return}if(engineBusy)return;engineBusy=true;engineFrame.contentWindow.postMessage({type:'aiciv-v13-tick'},location.origin)};
document.getElementById('zoomIn').onclick=()=>{zoom/=1.2;clampZoom()};document.getElementById('zoomOut').onclick=()=>{zoom*=1.2;clampZoom()};document.getElementById('fit').onclick=()=>{zoom=25;panX=panZ=0};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),touches=new Map();let moved=false,prev=null,pinch=null;
function tap(x,y){const rect=renderer.domElement.getBoundingClientRect();pointer.set((x-rect.left)/rect.width*2-1,-(y-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(hitObjects);if(hits.length){let b=hits[0].object.userData.building;show('🏢 '+safe(b.type||'Clădire'),'<p>Parcelă: '+safe(b.x)+', '+safe(b.y)+'</p><p>Nivel: '+safe(b.level??1)+' · Stare: '+safe(b.status||'activă')+'</p><p>Datele economice provin din salvarea V9.</p>')}}
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(touches.size===1)prev={x:e.clientX,y:e.clientY};if(touches.size===2){const a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);prev=null}});
renderer.domElement.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch&&d>4){zoom*=pinch/d;clampZoom();pinch=d}moved=true}else if(prev){let dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;panX-=(dx+dy)*zoom*.0009;panZ+=(dx-dy)*zoom*.0009;prev={x:e.clientX,y:e.clientY}}});
function end(e){if(!touches.has(e.pointerId))return;const single=touches.size===1;touches.delete(e.pointerId);if(single&&!moved)tap(e.clientX,e.clientY);if(touches.size<2)pinch=null;if(touches.size===0)prev=null}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY>0?1.09:.91;clampZoom()},{passive:false});
function animate(){requestAnimationFrame(animate);if(!paused){elapsed+=.012;simHour=(19+elapsed*.22)%24;const hour=Math.floor(simHour);document.getElementById('clock').textContent=(hour>=20||hour<6?'🌙 Noapte':'☀️ Zi')+' · '+String(hour).padStart(2,'0')+':00 · timp vizual';for(let i=0;i<people.length;i++){let t=elapsed*.35+i*2.73,x=(i*7)%16-7.5,z=(i*11)%16-7.5;people[i].position.set(x+Math.sin(t)*.27,.18,z+Math.cos(t)*.27)}for(let i=0;i<cars.length;i++){let t=(elapsed*.14+i*.17)%16,route=i%4;cars[i].position.set(route%2===0?t-7.5:route===1?-.5:3.5,.04,route%2===1?t-7.5:route===0?-.5:3.5);cars[i].rotation.y=route%2===1?Math.PI/2:0}sun.intensity=hour>=20||hour<6?.6:2.6}positionCamera();renderer.render(scene,camera)}window.addEventListener('resize',resize);resize();animate();
