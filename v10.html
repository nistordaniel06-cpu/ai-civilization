<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08131d"><title>AI Civilization V10.2 · Living City</title><style>*{box-sizing:border-box}body{margin:0;background:#08131d;color:#f4f8fb;font:14px system-ui}header{position:absolute;z-index:2;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(#08131de9,#08131d00);display:flex;justify-content:space-between;align-items:start}h1{font-size:17px;margin:0}small{color:#a7c0ce}.tag{color:#f6cc59;font-size:11px;letter-spacing:2px}.world{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#365b62,#0c1e28 80%)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:none}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.metric,.panel{background:#0b1c28dc;border:1px solid #54717b75;backdrop-filter:blur(12px);border-radius:13px;padding:11px}.metric{font-size:10px;color:#a5c0c9}.metric b{display:block;font-size:19px;color:#ffd76a}.panel{display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:auto}.panel button,.panel a{background:#f5c84d;color:#13222c;border:0;border-radius:9px;padding:11px;font-weight:750;text-decoration:none;font-size:12px}.panel button.secondary,.panel a.secondary{background:#243d4b;color:white}.tip{font-size:11px;color:#c2d4d8;margin:0 0 8px 4px;text-shadow:0 2px 4px #000}.info{position:absolute;top:90px;left:12px;right:12px;max-width:380px;padding:12px;border-radius:12px;background:#0b1c28e8;border:1px solid #5b7884;display:none;z-index:3}.info button{float:right;background:transparent;color:#fff;border:0;font-size:18px}.controls{position:absolute;right:12px;top:38%;display:grid;gap:8px}.controls button{border:1px solid #6d8590;background:#0a1b28d9;color:#fff;border-radius:12px;width:43px;height:43px;font-size:22px}.legend{font-size:11px;color:#b7cbd4;margin-top:7px}</style></head><body><div class="world"><canvas id="world"></canvas><header><div><div class="tag">LIVING WORLD · V10.2</div><h1>AI CIVILIZATION <span style="color:#ffd35b">10</span></h1><small>Cartiere · Drumuri · Cetățeni</small></div><a href="./governor.html" style="color:#f7d66a;text-decoration:none;font-weight:700">🏛 Governor</a></header><div class="info" id="info"><button id="close">×</button><b id="detailTitle"></b><p id="detailText"></p></div><div class="controls"><button id="plus">+</button><button id="minus">−</button><button id="resetCam">⌖</button></div><div class="hud"><p class="tip">👆 Trage harta · Zoom cu două degete · Atinge o clădire</p><div class="metrics"><div class="metric">LOCUITORI<b id="population">—</b></div><div class="metric">CLĂDIRI<b id="buildings">—</b></div><div class="metric">TREZORERIE<b id="treasury">—</b></div></div><div class="panel"><a href="./index.html" class="secondary">← Joc V9</a><button id="traffic">🚘 Trafic: ON</button><button id="follow" class="secondary">⟳ Reîncarcă</button></div><div class="legend">V10.2: pietoni și trafic vizual demonstrativ, fără navigație reală. Economia rămâne în V9.</div></div></div><script>
const cv=document.getElementById('world'),ctx=cv.getContext('2d'),key='aiciv-save';let city={},citizens=[],cam={x:0,y:95,z:1.32},traffic=true,hit=[],clock=0,drag=null;const palettes={house:['#f2c38b','#d78d66','#ac6559'],farm:['#b1b96e','#718f52','#506d45'],factory:['#b9b2a6','#817b7b','#5b5f68'],school:['#e3b4a2','#b57689','#855779'],lab:['#b9c9f4','#7695c7','#526a9d'],office:['#b3d9df','#6f9fae','#3b697d'],road:['#667780','#4c6470','#354d56']};function load(){try{city=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){city={}}if(!Array.isArray(city.buildings))city.buildings=[];citizens=Array.isArray(city.citizens)?city.citizens:(Array.isArray(city.people)?city.people:[]);document.getElementById('population').textContent=city.pop??'—';document.getElementById('buildings').textContent=city.buildings.length;document.getElementById('treasury').textContent=typeof city.money==='number'?Math.round(city.money).toLocaleString('ro-RO'):'—'}function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d);ctx.setTransform(d,0,0,d,0,0)}function iso(x,y){let unit=Math.min(innerWidth/15,36)*cam.z;return{x:(x-y)*unit*.85+innerWidth/2+cam.x,y:(x+y)*unit*.42+innerHeight*.28+cam.y,u:unit}}function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}}function tile(x,y,color){let p=iso(x,y),u=p.u;poly([[p.x,p.y-u*.42],[p.x+u*.85,p.y],[p.x,p.y+u*.42],[p.x-u*.85,p.y]],color,'#274a48')}function building(b,i){let p=iso(b.x,b.y),u=p.u;let colors=palettes[b.type]||['#d5c9b5','#ad886e','#7e675c'];let h=(.7+(i*13%6)*.22+(b.type==='office'?1.0:0))*u;let top=p.y-h,roof=[[p.x,top-u*.42],[p.x+u*.85,top],[p.x,top+u*.42],[p.x-u*.85,top]];poly([[p.x-u*.85,top],[p.x,top+u*.42],[p.x,p.y+u*.42],[p.x-u*.85,p.y]],colors[2]);poly([[p.x,top+u*.42],[p.x+u*.85,top],[p.x+u*.85,p.y],[p.x,p.y+u*.42]],colors[1]);poly(roof,colors[0],'#f6e8c5');ctx.fillStyle='#ffe8a4';for(let k=0;k<3;k++){let yy=top+u*.6+k*u*.3;if(yy>p.y)break;for(let j=0;j<2;j++){ctx.globalAlpha=.65+Math.sin(clock*.5+i+j+k)*.2;ctx.fillRect(p.x+u*(.12+j*.3),yy,u*.12,u*.14);ctx.fillRect(p.x-u*(.67-j*.3),yy,u*.1,u*.12)}}ctx.globalAlpha=1;if(b.type==='factory'){ctx.fillStyle='#8a9ca4';ctx.fillRect(p.x+u*.28,top-u*.48,u*.13,u*.6);ctx.fillStyle='#dce8ed66';ctx.beginPath();ctx.arc(p.x+u*.35+Math.sin(clock+i)*5,top-u*.6-clock%20,u*.16,0,Math.PI*2);ctx.fill()}hit.push({b,x:p.x,y:top+u*.25,r:u*.95})}function tree(x,y,i){let p=iso(x,y),u=p.u;ctx.fillStyle='#735a3c';ctx.fillRect(p.x-u*.055,p.y-u*.55,u*.11,u*.55);ctx.fillStyle=i%2?'#69a47c':'#85b98a';ctx.beginPath();ctx.arc(p.x,p.y-u*.7,u*.23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#acd5a566';ctx.beginPath();ctx.arc(p.x-u*.06,p.y-u*.78,u*.09,0,Math.PI*2);ctx.fill()}function car(x,y,i){let p=iso(x,y),u=p.u;let xx=p.x+Math.sin(clock*.45+i)*u*.5,yy=p.y+Math.cos(clock*.45+i)*u*.13;poly([[xx,yy-u*.13],[xx+u*.19,yy],[xx,yy+u*.13],[xx-u*.19,yy]],i%2?'#f5d45b':'#f1f1e9');ctx.fillStyle='#182d3c';ctx.fillRect(xx-u*.05,yy-u*.06,u*.11,u*.1)}function street(x,y){let p=iso(x,y),u=p.u;tile(x,y,'#51646c');ctx.strokeStyle='#d4cc9877';ctx.lineWidth=Math.max(1,u*.035);ctx.setLineDash([u*.18,u*.16]);ctx.beginPath();ctx.moveTo(p.x-u*.56,p.y-u*.27);ctx.lineTo(p.x+u*.56,p.y+u*.27);ctx.stroke();ctx.setLineDash([])}
function citizen(x,y,i){let p=iso(x,y),u=p.u;let sway=Math.sin(clock*.65+i*1.4),stride=(clock*.14+i*.37)%1;let px=p.x+Math.cos(i*2.4)*u*.22+sway*u*.11,py=p.y+Math.sin(i*2.4)*u*.09+stride*u*.08;ctx.fillStyle='#1b2837aa';ctx.beginPath();ctx.ellipse(px,py+u*.025,u*.10,u*.04,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=['#f3d16b','#7ac6cc','#e98b89','#d2a5e9'][i%4];ctx.fillRect(px-u*.045,py-u*.23,u*.09,u*.15);ctx.fillStyle='#e9c6a5';ctx.beginPath();ctx.arc(px,py-u*.28,u*.055,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let grad=ctx.createLinearGradient(0,0,0,innerHeight);grad.addColorStop(0,'#335963');grad.addColorStop(.65,'#1c3941');grad.addColorStop(1,'#0a1b25');ctx.fillStyle=grad;ctx.fillRect(0,0,innerWidth,innerHeight);let b=city.buildings||[],size=16;for(let y=0;y<size;y++)for(let x=0;x<size;x++)tile(x,y,(x+y)%4===0?'#3c765d':'#356c57');hit=[];let occ=new Set(b.map(v=>v.x+','+v.y));for(let y=0;y<size;y++)for(let x=0;x<size;x++){if(!occ.has(x+','+y)&&((x*7+y*11)%13===0))tree(x,y,x+y);else if(!occ.has(x+','+y)&&((x+y)%5===0))street(x,y)}let ordered=b.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));ordered.forEach((v,i)=>building(v,i));if(traffic){for(let i=0;i<Math.min(28,Math.max(8,b.length));i++){let x=(i*7+3)%size,y=(i*11+2)%size;if(!occ.has(x+','+y))car(x,y,i)}}for(let i=0;i<Math.min(45,Math.max(8,citizens.length));i++){let x=(i*7+5)%size,y=(i*11+3)%size;if(!occ.has(x+','+y))citizen(x,y,i)}clock+=.018;requestAnimationFrame(draw)}function inspect(x,y){let best=null,dist=1e9;for(let h of hit){let d=Math.hypot(x-h.x,y-h.y);if(d<dist){best=h;dist=d}}if(best&&dist<best.r*1.3){document.getElementById('detailTitle').textContent='🏢 '+(best.b.type||'Clădire').toUpperCase();document.getElementById('detailText').textContent='Parcelă '+best.b.x+', '+best.b.y+' · Parte din orașul tău V9. Deciziile economice sunt păstrate în simularea originală.';document.getElementById('info').style.display='block'}}cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;cam.x+=dx;cam.y+=dy;drag.x=e.clientX;drag.y=e.clientY});cv.addEventListener('pointerup',e=>{if(drag&&!drag.moved)inspect(e.clientX,e.clientY);drag=null});cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.5,Math.min(2.5,cam.z*(e.deltaY<0?1.1:.9)))},{passive:false});document.getElementById('plus').onclick=()=>cam.z=Math.min(2.5,cam.z*1.2);document.getElementById('minus').onclick=()=>cam.z=Math.max(.5,cam.z/1.2);document.getElementById('resetCam').onclick=()=>cam={x:0,y:95,z:1.32};document.getElementById('traffic').onclick=()=>{traffic=!traffic;document.getElementById('traffic').textContent='🚘 Trafic: '+(traffic?'ON':'OFF')};document.getElementById('follow').onclick=load;document.getElementById('close').onclick=()=>document.getElementById('info').style.display='none';window.addEventListener('storage',e=>{if(e.key===key)load()});window.addEventListener('resize',resize);load();resize();draw();
</script></body></html>
